[project]
name = "nova-backend"
version = "0.0.1"
description = "NOVA backend workspace (not a package)"
requires-python = "==3.12.*"
dependencies = ["nova-common", "nova-contracts", "nova-core"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
nova-common = { workspace = true }
nova-contracts = { workspace = true }
nova-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
