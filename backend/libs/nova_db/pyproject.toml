[project]
name = "nova-db"
version = "0.0.1"
description = "NOVA database: SQLAlchemy models and Alembic migrations (D37)"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.0",
    "nova-common",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.0.54",
]

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

[tool.uv.sources]
nova-common = { workspace = true }
