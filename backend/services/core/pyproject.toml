[project]
name = "nova-core"
version = "0.0.1"
description = "NOVA Core gateway"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "nova-common",
    "nova-contracts",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

[tool.uv.sources]
nova-common = { workspace = true }
nova-contracts = { workspace = true }
