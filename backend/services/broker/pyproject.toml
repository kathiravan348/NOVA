[project]
name = "nova-broker"
version = "0.0.1"
description = "NOVA broker service: the only code that calls Kite (D35, D39)"
requires-python = "==3.12.*"
dependencies = [
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "httpx2==2.13.1",
    "nova-common",
    "nova-contracts",
    "nova-db",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

[tool.uv.sources]
nova-common = { workspace = true }
nova-contracts = { workspace = true }
nova-db = { workspace = true }
