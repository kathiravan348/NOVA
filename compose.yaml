# NOVA local stack (D33, D36). Copy .env.example to .env first.
# Every port binds to 127.0.0.1; memory limits keep the stack within the WSL cap.
name: nova

x-backend: &backend
  build: ./backend
  image: nova-backend:dev
  environment:
    NOVA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    NOVA_REDIS_URL: redis://redis:6379/0
    NOVA_LOG_LEVEL: ${NOVA_LOG_LEVEL:-info}
    NOVA_API_DOCS: ${NOVA_API_DOCS:-false}
    NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN:?set in .env}
    NOVA_COOKIE_SECURE: ${NOVA_COOKIE_SECURE:-false}

services:
  db:
    container_name: nova-postgres
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${NOVA_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g

  redis:
    container_name: nova-redis
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${NOVA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  # Applies database migrations (D37), then exits; services start after it succeeds.
  migrate:
    <<: *backend
    container_name: nova-db-migrate
    command: ["python", "-m", "nova_db", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  # The only service that calls Kite (D35, D39). No host port: reached through NOVA Core only.
  broker:
    <<: *backend
    container_name: nova-broker-kite
    command: ["uvicorn", "--factory", "nova_broker.main:app_factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      NOVA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      NOVA_REDIS_URL: redis://redis:6379/0
      NOVA_LOG_LEVEL: ${NOVA_LOG_LEVEL:-info}
      NOVA_API_DOCS: ${NOVA_API_DOCS:-false}
      NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN:?set in .env}
      NOVA_BROKER_TOKEN_KEY: ${NOVA_BROKER_TOKEN_KEY:-}
      NOVA_RELAY_URL: ${NOVA_RELAY_URL:-http://localhost:3001}
      NOVA_KITE_DAILY_RESET: ${NOVA_KITE_DAILY_RESET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 384m

  # Strategies, versions and stats (D26, D43). No host port.
  strategy:
    <<: *backend
    container_name: nova-strategy-api
    command: ["uvicorn", "--factory", "nova_strategy.main:app_factory", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m

  # Backtest runs, results and trades (D44). No host port.
  backtest:
    <<: *backend
    container_name: nova-backtest-api
    command: ["uvicorn", "--factory", "nova_backtest.main:app_factory", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m

  # Runs queued backtests from the Postgres queue (D41, D44).
  backtest-worker:
    <<: *backend
    container_name: nova-backtest-worker
    command: ["python", "-m", "nova_backtest", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    mem_limit: 512m

  # NOVA Atlas API: data jobs and market data. No host port.
  atlas:
    <<: *backend
    container_name: nova-atlas-api
    command: ["uvicorn", "--factory", "nova_atlas.main:app_factory", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m

  # Runs data jobs from the Postgres queue (D41). Reaches Kite only through the broker.
  atlas-worker:
    <<: *backend
    container_name: nova-atlas-worker
    command: ["python", "-m", "nova_atlas", "worker"]
    environment:
      NOVA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      NOVA_REDIS_URL: redis://redis:6379/0
      NOVA_LOG_LEVEL: ${NOVA_LOG_LEVEL:-info}
      NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN:?set in .env}
      NOVA_BROKER_URL: http://broker:8000
      NOVA_ARCHIVE_DIR: /archive
    volumes:
      - tick-archive:/archive
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_started
    stop_grace_period: 30s
    mem_limit: 384m

  # Always on (D54): sleeps, and records live ticks 09:15-15:30 IST on weekdays while the switch in
  # Relay (Data jobs → Record live prices, `recorder_settings`) is on. Each session is a `tick_record` job.
  tick-recorder:
    <<: *backend
    container_name: nova-tick-recorder
    command: ["python", "-m", "nova_broker", "recorder"]
    environment:
      NOVA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      NOVA_REDIS_URL: redis://redis:6379/0
      NOVA_LOG_LEVEL: ${NOVA_LOG_LEVEL:-info}
      NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN:?set in .env}
      NOVA_BROKER_TOKEN_KEY: ${NOVA_BROKER_TOKEN_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 256m

  core:
    <<: *backend
    container_name: nova-core-api
    ports:
      - "127.0.0.1:${NOVA_CORE_PORT:-8000}:8000"
    environment:
      NOVA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      NOVA_REDIS_URL: redis://redis:6379/0
      NOVA_LOG_LEVEL: ${NOVA_LOG_LEVEL:-info}
      NOVA_API_DOCS: ${NOVA_API_DOCS:-false}
      NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN:?set in .env}
      NOVA_COOKIE_SECURE: ${NOVA_COOKIE_SECURE:-false}
      NOVA_BROKER_URL: http://broker:8000
      NOVA_ATLAS_URL: http://atlas:8000
      NOVA_STRATEGY_URL: http://strategy:8000
      NOVA_BACKTEST_URL: http://backtest:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 512m

  backend-check:
    <<: *backend
    profiles: ["tools"]
    environment:
      NOVA_DATABASE_URL: postgresql+psycopg://unused@localhost/unused
      NOVA_REDIS_URL: redis://unused:6379/0
      # Maintenance database: tests create and drop their own throwaway database (D37).
      NOVA_TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/postgres
      # Redis tests use db 15 and flush it (D40).
      NOVA_TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/repo:ro
    working_dir: /repo/backend
    command: ["sh", "scripts/check.sh"]
    mem_limit: 1536m

volumes:
  db-data:
  tick-archive:
